name: Build Toronto One image
run-name: Remote image ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed source SHA to build
        required: true
        type: string
      release_id:
        description: Unique deployment request ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: toronto-one-remote-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: registry.cloudflare.com/2d1132aadb6f2dd369f0b914b2df9678/toronto-one-remote:${{ inputs.source_ref }}
    steps:
      - name: Validate committed source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '[[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Run checks and build on GitHub
        run: docker build --platform linux/amd64 --provenance=false --tag "$IMAGE" .
      - name: Push private image to Cloudflare
        env:
          REGISTRY_USER: ${{ secrets.CF_UI_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.CF_UI_REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login registry.cloudflare.com --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee image-reference.txt
          cat image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry login
        if: always()
        run: docker logout registry.cloudflare.com
